<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<script>/* Muse 内嵌预览（iframe）时宿主已预留导航与安全区：首绘前挂 .embedded 关掉应用自己的安全区阀门（styles.css --sat/--sab）。独立打开时不挂，正常走 env()。 */if (window.self !== window.top) document.documentElement.classList.add('embedded');</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="verweile">
<meta name="theme-color" content="#ececed">
<title>verweile</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
/* UWU 聊天 · UI 重设计（按原型 uwu-liao-tian-ui-yuan-xing 移植）。
   iOS 26 式中性系统色、明亮浅色、薄透液态玻璃；背景主导，亮度均匀无热点。
   单一事实来源：全站玻璃/配色变量只在这个 :root 里定义，文件里不许再出现
   第二个 :root 覆盖（旧的 verweile 段 :root 已合并进来并删除）。
   运行期 js/theme.js 的 applyVars() 会覆盖 --bg-veil / --glass-blur-amt /
   --ink / --bubble-me / --bubble-ai 等少量变量，其余以这里为准。 */
:root {
  color-scheme: light;
  --ink: #292929;
  --ink-2: #606060;
  --ink-3: #787878;
  --accent: #424242;
  --accent-deep: #353535;
  --accent-soft: #dedede;
  --accent-softer: #eeeeee;
  --mint: #8c8c8c;
  --paper: #eeeeee;
  --line: rgba(48, 48, 48, .07);
  --line-soft: rgba(48, 48, 48, .04);
  /* clear 材质：白底 0.05 起、模糊 6px 起、细描边 0.20；两层轻短投影，无白内边 */
  --glass-blur-amt: 6px;
  --glass-bg: rgba(255, 255, 255, .05);
  --glass-bg-strong: rgba(255, 255, 255, .55);
  --glass-border: rgba(255, 255, 255, .20);
  --glass-blur: blur(var(--glass-blur-amt)) saturate(1.15);
  --glass-shadow: 0 4px 12px rgba(0, 0, 0, .05), 0 1px 3px rgba(0, 0, 0, .04), inset 0 1px 0 rgba(255, 255, 255, .14), inset 0 -1px 0 rgba(255, 255, 255, .05);
  --bubble-me: rgba(221, 221, 221, .35);
  --bubble-me-ink: #303030;
  --bubble-ai: rgba(255, 255, 255, .22);
  --bubble-ai-ink: #303030;
  --bg-veil: .12;
  --r-lg: 24px;
  --r-md: 20px;
  --r-sm: 14px;
  --r-bubble: 17.5px;
  --sp: 16px;
  --font: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Apple SD Gothic Neo", "PingFang SC", "Noto Sans", sans-serif;
  --ease: cubic-bezier(.32, .72, .24, 1);
  /* 安全区阀门（2026-11-21）：全站的安全区留白只走 --sat/--sab 这两个变量。
     独立打开（PWA/浏览器）时取 env() 正常值；嵌在 Muse 预览 iframe 里时，
     宿主的导航/底栏已经占了安全区，webview 上报的 env() 会把宿主高度再算
     一遍（实测顶栏多出约 123px），属于重复预留——此时 html.embedded 把阀门
     关到 0，只用各自实际可用高度。 */
  --sat: env(safe-area-inset-top);
  --sab: env(safe-area-inset-bottom);
}
html.embedded { --sat: 0px; --sab: 0px; }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  font-family: var(--font);
  background: #ededed; color: var(--ink); font-size: 15px; line-height: 1.5;
  overscroll-behavior: none;
}
button { font-family: inherit; cursor: pointer; }
input, textarea, select { font-family: inherit; font-size: 15px; color: var(--ink); }
.hidden { display: none !important; }
.muted { color: var(--ink-3); font-size: 12px; }

/* 单色描边图标 */
.icon { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
.icon.sm { width: 18px; height: 18px; }
.icon.lg { width: 25px; height: 25px; }

/* 手机框 */
#app {
  position: relative; display: flex; flex-direction: column;
  height: 100dvh; width: min(430px, 100vw); margin: 0 auto;
  background: linear-gradient(180deg, #ffffff, #f7f7f7);
  overflow: hidden;
}
@media (min-width: 560px) {
  #app {
    height: min(920px, calc(100dvh - 44px)); margin-top: 22px;
    border-radius: 46px;
    box-shadow: 0 30px 80px rgba(0, 0, 0, .20), 0 0 0 1px rgba(0, 0, 0, .06);
  }
}

/* 背景层 + 玻璃画布 */
.bg-layer { position: absolute; inset: 0; z-index: 0; opacity: 0; transition: opacity .45s var(--ease); background-size: cover; background-position: center; }
.bg-layer::after { content: ""; position: absolute; inset: 0; background: rgba(250, 250, 250, var(--bg-veil)); }
#app.has-bg { background: #f5f5f5; }
#app.has-bg .bg-layer { opacity: 1; }
#gl-canvas { position: absolute; inset: 0; z-index: 1; width: 100%; height: 100%; display: block; pointer-events: none; }

/* 液态玻璃：CSS 降级层（WebGL 接管后由 .gl-webgl 覆盖）。薄清：白底 .05、模糊 6px、
   细描边 .20、两层轻投影；不给整个组件设 opacity，文字图标保持清晰。 */
.glass {
  background: linear-gradient(135deg, rgba(255, 255, 255, .05) 0%, rgba(255, 255, 255, .02) 52%, rgba(255, 255, 255, .04) 100%), var(--glass-bg);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 1px solid var(--glass-border);
  box-shadow: var(--glass-shadow);
}
/* WebGL 接管后：CSS 彻底清零，只留细描边与轻投影，玻璃效果全交给画布 */
.glass.gl-webgl {
  background: transparent;
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
  border-color: rgba(255, 255, 255, .18);
  box-shadow: 0 2px 8px rgba(0, 0, 0, .04), 0 1px 2px rgba(0, 0, 0, .03);
}
/* 按组件分别调强度（不共用一套固定强度，小元素更轻）。
   气泡单行/多行的高度区分 CSS 没有高度选择器，统一用最轻的一档，
   高度分档由 JS 引擎按 class+高度做参数覆盖。 */
.tabbar.glass { background: rgba(255, 255, 255, .06); }
.status-strip.glass { background: rgba(255, 255, 255, .05); box-shadow: 0 2px 8px rgba(0, 0, 0, .04), 0 1px 2px rgba(0, 0, 0, .03); }
.input-shell.glass { background: rgba(255, 255, 255, .06); }
/* 大卡片最轻：只留 0.04 白底 + 4px 模糊，让壁纸线稿透出来 */
.group.glass, .char-card.glass, .hero-card.glass, .post.glass { background: rgba(255, 255, 255, .04); backdrop-filter: blur(4px) saturate(1.1); -webkit-backdrop-filter: blur(4px) saturate(1.1); border-color: rgba(255, 255, 255, .16); box-shadow: 0 2px 8px rgba(0, 0, 0, .03); }
.sheet-card.glass, .status-sheet.glass { background: rgba(255, 255, 255, .06); }
.modal-card.glass { background: rgba(255, 255, 255, .55); backdrop-filter: blur(8px) saturate(1.1); -webkit-backdrop-filter: blur(8px) saturate(1.1); }
/* 嵌套子元素去玻璃化：只留淡底，不叠 backdrop-filter / 白边 / 白底 / 投影 */
.m-ico.glass, .post-action.glass, .chip.glass, .tag-now.glass { background: rgba(255, 255, 255, .06); backdrop-filter: none; -webkit-backdrop-filter: none; border-color: rgba(255, 255, 255, .14); box-shadow: none; }
/* WebGL 态下所有组件一律清零（放在组件强度规则之后，靠更高特异度取胜） */
.chat-head.glass.gl-webgl, .tabbar.glass.gl-webgl, .status-strip.glass.gl-webgl, .input-shell.glass.gl-webgl, .group.glass.gl-webgl, .char-card.glass.gl-webgl, .hero-card.glass.gl-webgl, .post.glass.gl-webgl, .sheet-card.glass.gl-webgl, .status-sheet.glass.gl-webgl, .modal-card.glass.gl-webgl, .m-ico.glass.gl-webgl, .post-action.glass.gl-webgl, .quote-bar.glass.gl-webgl { background: transparent; backdrop-filter: none; -webkit-backdrop-filter: none; border-color: rgba(255, 255, 255, .18); box-shadow: 0 2px 8px rgba(0, 0, 0, .04), 0 1px 2px rgba(0, 0, 0, .03); }
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .glass { background: var(--glass-bg-strong); }
}

/* 三页容器 */
.views { position: relative; z-index: 2; flex: 1; min-height: 0; }
.view { position: absolute; inset: 0; display: none; flex-direction: column; overflow: hidden; }
.view.active { display: flex; animation: viewIn .34s var(--ease); }
@keyframes viewIn { from { opacity: 0; transform: translateY(8px) scale(.995); } }

/* 品牌行只留主界面：聊天页激活时隐藏（节点不删，三页共用）。
   .in-chat 由 app.js 按 #view-chat 的激活态同步到 #app 上。 */
#app.in-chat .brand-bar { display: none; }
/* 聊天详情页完整沉浸式：项目内部主导航在聊天页隐藏，只留返回按钮回主界面。 */
#app.in-chat #tabbar { display: none; }
/* 常驻大状态条与底部自动回复行已取消：节点保留在 DOM 里（JS 仍写它们），
   控制移入顶栏 ··· 菜单与角色设置；这里只负责不在聊天页显示。 */
#status-strip { display: none; }
#auto-row { display: none; }

/* 底部悬浮胶囊 Tab 栏 */
.tabbar {
  position: relative; z-index: 8; display: flex;
  margin: 6px 18px calc(10px + var(--sab));
  border-radius: 999px; padding: 5px;
}
.tabbar .pill {
  position: absolute; top: 5px; bottom: 5px; left: 5px; width: 0;
  background: rgba(255, 255, 255, .10);
  border: 1px solid rgba(255, 255, 255, .25); border-radius: 999px;
  box-shadow: 0 1px 3px rgba(0, 0, 0, .04);
  transition: left .38s var(--ease), width .38s var(--ease);
}
.tab {
  position: relative; z-index: 1; flex: 1; min-height: 52px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  background: none; border: none; font-size: 11px; font-weight: 700; color: var(--ink-3);
}
.tab.active { color: var(--ink); }
.tab-badge {
  position: absolute; top: 5px; right: calc(50% - 24px);
  background: #646464; color: #ffffff; min-width: 17px; height: 17px; border-radius: 9px;
  font-size: 10px; font-weight: 800; border: 2px solid #ffffff;
  display: flex; align-items: center; justify-content: center; padding: 0 4px;
}

.icon-btn {
  background: none; border: none; color: var(--ink);
  width: 40px; height: 40px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.icon-btn:active { background: rgba(0, 0, 0, .05); }
.icon-btn.round {
  width: 42px; height: 42px;
  background: var(--glass-bg);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 1px solid var(--glass-border);
}
.icon-btn.round.glass.gl-webgl { background: transparent; backdrop-filter: none; -webkit-backdrop-filter: none; }
.badge { font-size: 11px; padding: 2px 7px; border-radius: 999px; background: rgba(0, 0, 0, .05); color: var(--ink-2); border: 1px solid rgba(0, 0, 0, .05); white-space: nowrap; }
.badge.mock { background: var(--accent-softer); color: var(--accent-deep); border-color: rgba(97, 97, 97, .18); }
.mock-tag { font-size: 10px; font-weight: 700; color: var(--accent-deep); background: var(--accent-softer); padding: 2px 7px; border-radius: 999px; align-self: flex-start; margin-top: 4px; }

/* 状态条 + 状态面板 */
.status-strip {
  display: flex; align-items: center; gap: 8px; flex-shrink: 0; cursor: pointer;
  margin: 10px 12px 0; border-radius: var(--r-md); padding: 10px 14px 11px;
}
.status-strip .chips { flex: 1; display: flex; gap: 6px; flex-wrap: wrap; min-width: 0; }
.chip {
  font-size: 12px; font-weight: 600; color: var(--ink-2);
  background: rgba(255, 255, 255, .08); border: 1px solid rgba(255, 255, 255, .22);
  padding: 4px 9px; border-radius: 999px; white-space: nowrap;
  max-width: 100%; overflow: hidden; text-overflow: ellipsis;
}
.status-strip .chev { background: none; border: none; color: var(--ink-3); display: flex; padding: 2px; }
/* 状态栏弹窗：点顶栏昵称标题 / 心形打开。
   三 bug 收口（根因见 docs/chat-audit.md §⑦）：
   1) 定位基准：fixed（跟视口走）→ absolute（跟 #app 走，与 .sheet/.modal 一致），
      且节点已移到 #app 的直接子节点，不再困在 .views 的层叠上下文里——
      这样遮罩才能盖住 Tab 栏，卡片不再顶出手机框；
   2) 底缘避让：底部抽屉式对齐，padding-bottom 96px 给 Tab 栏留出位置，
      sheet 背景加到 .88 不透明，不再让底栏从半透明 sheet 下透出来；
   3) 关闭按钮：footer 改为 sticky 贴在 sheet 底部并带实底，不再是透明文字
      叠在 Tab 栏图标上；sheet 最大宽改为 100%，不再有 520px 越界。 */
.status-popup { position: absolute; inset: 0; z-index: 60; display: flex; align-items: flex-end; justify-content: center; padding: calc(16px + var(--sat)) 12px calc(96px + var(--sab)); }
.status-scrim { position: absolute; inset: 0; background: rgba(30, 30, 30, .28); }
.status-sheet { position: relative; width: 100%; max-width: 100%; max-height: 100%; overflow-y: auto; overscroll-behavior: contain; border-radius: var(--r-lg); padding: 14px 14px 0; font-size: 13px; display: flex; flex-direction: column; }
.status-sheet.glass { background: rgba(255, 255, 255, .88); backdrop-filter: blur(14px) saturate(1.1); -webkit-backdrop-filter: blur(14px) saturate(1.1); }
/* WebGL 接管后也不许把状态 sheet 清回透明——否则底栏又会透出来 */
.status-sheet.glass.gl-webgl { background: rgba(255, 255, 255, .82); backdrop-filter: none; -webkit-backdrop-filter: none; }
.status-sheet-head { display: flex; justify-content: space-between; align-items: center; color: var(--ink-3); font-size: 12px; margin-bottom: 4px; }
.status-sheet-foot { position: sticky; bottom: 0; display: flex; gap: 4px; justify-content: space-between; margin: 10px -14px 0; padding: 8px 14px calc(10px + var(--sab)); border-top: 1px solid rgba(0, 0, 0, .06); background: rgba(255, 255, 255, .94); border-radius: 0 0 var(--r-lg) var(--r-lg); }
/* 底部三个按钮是透明的：无底色、无边框，只剩文字，点按时才有一点浅灰反馈 */
.ghost-btn { flex: 1; background: transparent; border: 0; color: var(--ink-2); font-size: 14px; padding: 10px 8px; min-height: 44px; border-radius: 999px; cursor: pointer; }
.ghost-btn:active { background: rgba(0, 0, 0, .06); }
.ghost-btn[disabled] { opacity: .35; pointer-events: none; }
#status-close { color: var(--ink); font-weight: 600; }
.status-custom { margin: 4px 0; min-width: 0; max-width: 100%; overflow-x: hidden; }
/* 状态栏渲染用沙箱 iframe：宽度跟随面板，高度由内部 postMessage 上报后由父页面设定。
   外层再夹一道 max-width：模板写死宽度的元素在 iframe 内被 STATUS_FRAME_CSS 约束，
   iframe 本身绝不顶出 sheet（statusBar.js 不在本轮文件集里，帧内样式未动）。 */
.status-frame { width: 100%; max-width: 100%; border: 0; display: block; background: transparent; overflow: hidden; }
.html-card-frame { width: 100%; border: 0; display: block; background: transparent; }

/* 调试模式样式（对照原始 UWU 的 .message-bubble.debug-visible，css/chat.css:634） */
.bubble.debug-visible { background: rgba(238, 238, 238, .8); border: 1px dashed #999; color: #555; font-family: monospace; font-size: 13px; white-space: pre-wrap; }
.bubble.debug-visible::before { content: '【调试可见】'; display: block; font-size: 10px; color: #d32f2f; margin-bottom: 4px; font-weight: bold; }
.status-error { color: var(--ink-2); background: rgba(0, 0, 0, .05); border-radius: 10px; padding: 7px 10px; font-size: 12px; margin: 4px 0 8px; }
.status-details { margin-top: 6px; }
.status-details summary { cursor: pointer; color: var(--ink-3); font-size: 12px; padding: 2px 0; }
.status-code { white-space: pre-wrap; word-break: break-all; font-size: 11.5px; line-height: 1.55; color: var(--ink-2); background: rgba(0, 0, 0, .04); border-radius: 10px; padding: 8px 10px; margin: 4px 0 0; max-height: 180px; overflow-y: auto; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.status-raw { color: var(--ink-3); font-size: 12px; word-break: break-all; }
.status-history { margin-top: 6px; color: var(--ink-3); font-size: 12px; }
.status-history-row { padding: 3px 0; border-top: 1px dashed rgba(0, 0, 0, .07); font-size: 12px; color: var(--ink-2); }
/* 状态栏模板编辑用等宽字体，方便看正则与 HTML */
#f-sp-regex, #f-sp-replace { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }

.load-more { align-self: center; background: rgba(255, 255, 255, .12); border: 1px solid rgba(0, 0, 0, .08); color: var(--ink-2); border-radius: 999px; padding: 5px 14px; font-size: 13px; margin: 4px 0 8px; }
.time-divider { text-align: center; color: var(--ink-3); font-size: 11.5px; font-weight: 600; margin: 10px 0 4px; }
.msg { display: flex; gap: 0; margin: 1px 0; max-width: 100%; container-type: inline-size; }
/* 组内 2px、换方多 +15px（组间 17px）：间距只靠 margin，#message-area gap 已归零 */
.msg:not(.continuous) { margin-top: 16px; }
.msg:not(.continuous):first-child { margin-top: 1px; }
.msg.sent { flex-direction: row-reverse; }
/* 默认不在任何消息旁显示头像（分组首条也不显示）：.msg-avatar 已整段删掉，
   这里不留占位规则。.msg（整行）是引用气泡 58cqw 的容器——注意不能把
   container-type 放在 .msg-body 上：inline-size  containment 会让它失去按
   内容自适应宽度的能力，气泡缩成一字一行的窄条。 */
.msg-body { max-width: 76%; min-width: 0; }
.msg.sent .msg-body { display: flex; flex-direction: column; align-items: flex-end; }
.bubble {
  position: relative; isolation: isolate;
  padding: 7px 14px; border-radius: var(--r-bubble); font-size: 15px; line-height: 1.4;
  word-break: break-word; white-space: pre-wrap; max-width: 100%;
  background: var(--bubble-ai); color: var(--bubble-ai-ink);
  border: 1px solid rgba(255, 255, 255, .20);
  backdrop-filter: blur(6px) saturate(1.1);
  -webkit-backdrop-filter: blur(6px) saturate(1.1);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .22), 0 1px 2px rgba(0, 0, 0, .03), 0 4px 10px rgba(0, 0, 0, .04);
}
/* 尾巴可见性（2026-11-21）：尾巴 ::before 只有半透明填充、无描边/阴影/模糊，
   在浅色壁纸上与背景只差几个色阶，肉眼等于没有。白色填充再加深也没用——
   255 的白在 240 的底上满透明度也只差 15。drop-shadow 跟随 mask 后的 alpha
   形状（普通 box-shadow 不跟随），给尾巴描一道软边；只动尾巴本身，不动气泡
   形状、分组逻辑与配色体系。深色壁纸下填充本身已够亮（差值 45+），同一道
   阴影不碍事。 */
.msg.received.group-last .bubble::before,
.msg.sent.group-last .bubble::before,
.msg.group-last .voice-card::before,
.msg.group-last .transfer-card::before,
.msg.group-last .gift-card::before,
#app.bubble-glass .msg.received.group-last .bubble::before,
#app.bubble-glass .msg.sent.group-last .bubble::before {
  filter: drop-shadow(0 1px 1px rgba(0, 0, 0, .28));
}
.msg.sent .bubble {
  background: var(--bubble-me); color: var(--bubble-me-ink);
  border: 1px solid rgba(255, 255, 255, .18); backdrop-filter: blur(6px) saturate(1.1); -webkit-backdrop-filter: blur(6px) saturate(1.1);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .22), 0 1px 2px rgba(0, 0, 0, .03), 0 4px 10px rgba(0, 0, 0, .04);
}
.bubble .bubble-text { transition: opacity .2s; }
.bubble .toggle-t { position: relative; z-index: 2; display: block; margin-top: 4px; font-size: 12px; color: var(--ink-3); background: none; border: none; padding: 0; text-align: left; }
.msg-meta { font-size: 11px; color: var(--ink-3); margin-top: 2px; }
.msg.withdrawn .bubble { background: #f2f2f2; color: var(--ink-3); font-size: 13px; border-style: dashed; backdrop-filter: none; -webkit-backdrop-filter: none; }
.msg.system-note { justify-content: center; }
.msg.system-note .bubble { background: rgba(119, 119, 119, .12); color: var(--ink-2); font-size: 12.5px; border: none; text-align: center; border-radius: 999px; backdrop-filter: none; -webkit-backdrop-filter: none; box-shadow: none; }
/* 引用原文样式见 chat.css（透明描边轮廓 + SVG 引导线）。
   此处旧的填充小气泡 / 24×21 尾巴 / 边框弧线规则已删除——它们会把新描边框死在 24×21px 里。 */
.sticker-img { max-width: 160px; max-height: 180px; border-radius: 17.5px; display: block; }
.photo-img { max-width: 230px; max-height: 230px; border-radius: 17.5px; display: block; }
.msg-body .card { width: 218px; max-width: 100%; }
.card { border: 1px solid rgba(255, 255, 255, .20); border-radius: 18px; background: rgba(255, 255, 255, .10); padding: 10px 12px; }
.card .card-title { font-weight: 700; font-size: 14px; }
.card .card-sub { color: var(--ink-2); font-size: 13px; margin-top: 2px; white-space: pre-wrap; word-break: break-word; }
.card .card-actions { display: flex; gap: 8px; margin-top: 8px; }
.card .card-actions button { flex: 1; padding: 7px 0; border-radius: 999px; border: none; background: rgba(255, 255, 255, .55); font-size: 13px; font-weight: 600; color: var(--ink); }
.card .card-status { font-size: 12px; color: var(--ink-2); margin-top: 6px; }
.placeholder-card { border: 1px dashed rgba(0, 0, 0, .18); background: rgba(0, 0, 0, .03); color: var(--ink-2); font-size: 13px; }
.voice-row { display: flex; align-items: center; gap: 10px; }
.voice-transcript { font-size: 13px; line-height: 1.5; padding: 2px 2px 6px; white-space: pre-wrap; word-break: break-word; }
.voice-transcript.hidden { display: none; }
.voice-play {
  width: 30px; height: 30px; border-radius: 50%; border: none; flex-shrink: 0;
  background: var(--ink); color: #ffffff; display: flex; align-items: center; justify-content: center;
}
.voice-play .icon { width: 16px; height: 16px; margin-left: 2px; }
.voice-wave { display: flex; align-items: center; gap: 2px; height: 22px; }
.voice-wave i { width: 3px; background: var(--ink-3); border-radius: 2px; display: block; }
.voice-dur { font-size: 12px; font-weight: 700; color: var(--ink-2); white-space: nowrap; }
.edited-tag { font-size: 11px; color: var(--ink-3); }

@keyframes blink { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }


.input-shell {
  position: relative; flex: 1; border-radius: 28px; padding: 0 5px 0 0; min-height: 44px;
  display: flex; align-items: center; gap: 4px;
}
.input-shell:focus-within { box-shadow: 0 0 0 3px rgba(97, 97, 97, .15), var(--glass-shadow); }
.input-shell .icon-btn { width: 34px; height: 34px; }
.send-btn {
  width: 34px; height: 34px; border-radius: 50%; border: none; flex-shrink: 0; align-self: center;
  background: var(--ink); color: #ffffff; display: none; align-items: center; justify-content: center;
}
.send-btn .icon { width: 18px; height: 18px; }
#composer.has-text .send-btn { display: flex; }
#composer.has-text .reply-btn { display: none; }
#composer.generating .reply-btn { display: inline-flex; }
#composer.generating .send-btn { display: none; }
.reply-btn {
  width: 34px; height: 34px; border-radius: 50%; border: none; padding: 0;
  background: var(--ink); color: #ffffff; flex-shrink: 0; align-self: center;
  display: inline-flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 14px rgba(97, 97, 97, .28);
}
.reply-btn .icon { width: 18px; height: 18px; }
.reply-btn.generating { background: #646464; box-shadow: 0 4px 14px rgba(100, 100, 100, .28); }
.reply-btn:disabled { opacity: .45; }
.auto-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 2px 16px calc(6px + var(--sab)); font-size: 12px; color: var(--ink-3); flex-shrink: 0; }
.auto-row label { display: flex; align-items: center; gap: 6px; }
.save-state { font-size: 11px; color: var(--ink-3); white-space: nowrap; }

/* iOS 风格开关（所有复选框）：51×31 轨道、27px 白圆钮、开启态系统绿 #34c759。
   注意：.field input 的全宽文本框样式（width:100%）不许再把开关拉成整行长条，
   见下面 B 组块里的 .field input[type="checkbox"] 后备防线与 .switch 结构。 */
input[type="checkbox"] {
  appearance: none; -webkit-appearance: none;
  width: 51px; height: 31px; border-radius: 999px; background: #e9e9ea;
  position: relative; flex-shrink: 0; cursor: pointer; transition: background .2s; margin: 0;
  border: none; padding: 0;
}
input[type="checkbox"]:checked { background: #34c759; }
input[type="checkbox"]::after {
  content: ""; position: absolute; width: 27px; height: 27px; border-radius: 50%;
  background: #ffffff; top: 2px; left: 2px; transition: transform .2s;
  box-shadow: 0 1px 3px rgba(0, 0, 0, .2);
}
input[type="checkbox"]:checked::after { transform: translateX(20px); }

/* 页头（动态 / 管理） */
.page-head { display: flex; align-items: center; justify-content: space-between; padding: calc(10px + var(--sat)) 20px 8px; flex-shrink: 0; }
.page-head h1 { font-size: 28px; font-weight: 700; letter-spacing: -.01em; margin: 0; }
.moments-scroll, .manage-scroll { flex: 1; overflow-y: auto; padding: 0 14px calc(16px + var(--sab)); min-height: 0; }

/* 动态页 */
.hero-card { display: flex; gap: 12px; margin-top: 6px; border-radius: var(--r-lg); padding: 16px; }
.avatar-ph { border-radius: 50%; background: linear-gradient(135deg, #e8e8e8, #e1e1e1); color: var(--ink-2); display: flex; align-items: center; justify-content: center; font-weight: 700; flex-shrink: 0; }
.hero-info { flex: 1; min-width: 0; }
.hero-name { font-size: 17px; font-weight: 800; }
.hero-mono { background: rgba(255, 255, 255, .50); border: 1px solid rgba(0, 0, 0, .04); border-radius: 16px; padding: 11px 13px; font-size: 14px; line-height: 1.65; margin-top: 8px; }
.post { background: rgba(255, 255, 255, .08); border: 1px solid rgba(255, 255, 255, .20); border-radius: var(--r-lg); padding: 15px 16px 12px; box-shadow: 0 2px 8px rgba(0, 0, 0, .03); margin-top: 12px; }
.post-head { display: flex; gap: 10px; align-items: center; }
.post-meta { min-width: 0; }
.post-name { font-size: 14.5px; font-weight: 800; }
.post-time { font-size: 11.5px; color: var(--ink-3); }
.post-body { font-size: 14.5px; line-height: 1.7; margin-top: 10px; }
.post-photo { height: 150px; border-radius: 16px; background: linear-gradient(135deg, #ebebeb, #e1e1e1); display: flex; align-items: center; justify-content: center; color: var(--ink-3); font-size: 13px; margin-top: 10px; }
.post-actions { display: flex; gap: 6px; margin-top: 10px; }
.post-action { display: flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 700; padding: 6px 12px; border-radius: 999px; border: 1px solid rgba(0, 0, 0, .06); background: rgba(255, 255, 255, .08); color: var(--ink-2); }
.post-action .icon { width: 16px; height: 16px; }
.post-action.liked { color: #646464; border-color: rgba(100, 100, 100, .3); }
.post-comments { margin-top: 8px; }
.post-comment { font-size: 13px; padding: 6px 0; border-top: 1px dashed rgba(0, 0, 0, .06); }
.moments-foot { text-align: center; margin: 16px 0 4px; }

/* 管理页 */
.char-card { display: flex; align-items: center; gap: 12px; border-radius: var(--r-lg); padding: 16px; margin-top: 6px; cursor: pointer; }
.char-card-avatar { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; background: #e3e3e3; flex-shrink: 0; }
.char-card-info { flex: 1; min-width: 0; }
.char-card-name { font-size: 16.5px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.char-card-sub { font-size: 12.5px; color: var(--ink-2); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tag-now { font-size: 10.5px; font-weight: 800; color: var(--accent-deep); background: var(--accent-softer); padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
.char-card-chev { color: var(--ink-3); display: flex; flex-shrink: 0; }
.group-label { font-size: 12px; font-weight: 800; color: var(--ink-3); letter-spacing: .06em; margin: 18px 2px 8px; }
.group { background: rgba(255, 255, 255, .08); border-radius: var(--r-lg); border: 1px solid rgba(255, 255, 255, .20); box-shadow: 0 2px 8px rgba(0, 0, 0, .03); overflow: hidden; }
.m-row { position: relative; display: flex; align-items: center; gap: 12px; width: 100%; min-height: 58px; padding: 11px 14px; background: none; border: none; text-align: left; }
.m-row + .m-row::after { content: ""; position: absolute; left: 62px; right: 0; top: 0; height: 1px; background: rgba(0, 0, 0, .05); }
.m-ico { width: 38px; height: 38px; border-radius: 12px; background: rgba(255, 255, 255, .06); display: flex; align-items: center; justify-content: center; color: var(--ink-2); flex-shrink: 0; }
.m-ico .icon { width: 20px; height: 20px; }
.m-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.m-name { font-size: 15px; font-weight: 600; }
.m-desc { font-size: 12px; color: var(--ink-3); }
.m-count { font-size: 13px; color: var(--ink-3); white-space: nowrap; }
.m-chev { color: var(--ink-3); display: flex; flex-shrink: 0; }
.m-chev .icon { width: 18px; height: 18px; }

/* 二级页 */
.subpage {
  position: absolute; inset: 0; z-index: 20; display: flex; flex-direction: column;
  transform: translateX(102%); transition: transform .38s var(--ease); visibility: hidden;
  background: linear-gradient(180deg, #ffffff, #f7f7f7);
}
.subpage.open { transform: none; visibility: visible; }
#app.has-bg .subpage { background: rgba(238, 238, 238, .50); backdrop-filter: blur(8px) saturate(1.15); -webkit-backdrop-filter: blur(8px) saturate(1.15); }
.sub-head { display: flex; align-items: center; padding: calc(10px + var(--sat)) 12px 8px; flex-shrink: 0; }
.sub-head h2 { flex: 1; text-align: center; font-size: 16.5px; font-weight: 800; margin: 0; }
.sub-head-spacer { width: 40px; flex-shrink: 0; }
.sub-body { flex: 1; overflow-y: auto; padding: 12px 16px calc(20px + var(--sab)); min-height: 0; }
.sub-body .card { width: auto; background: var(--glass-bg); border-radius: var(--r-md); padding: 15px 16px; margin-bottom: 12px; }
.sub-body h3 { font-size: 14px; margin: 18px 0 6px; color: var(--ink-2); }
.sub-body h3:first-child { margin-top: 0; }

/* 表单 */
.field label { font-size: 13px; color: var(--ink-2); display: block; margin-top: 10px; }
.field input, .field textarea, .field select {
  width: 100%; border: 1px solid rgba(0, 0, 0, .12); border-radius: 13px;
  padding: 8px 10px; margin-top: 4px; background: #ffffff; min-height: 42px; outline: none;
}
.field input:focus, .field textarea:focus, .field select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(97, 97, 97, .15); }
.field textarea { min-height: 80px; resize: vertical; }
.field .row { display: flex; gap: 8px; }
.field .row > * { flex: 1; }
.field .hint, .hint { font-size: 12px; color: var(--ink-3); margin-top: 4px; }
.check-row { display: flex; align-items: center; gap: 8px; padding: 8px 0; font-size: 14px; }
.check-row.ok { color: #6f6f6f; }
.check-row.bad { color: #2f2f2f; }
.list-item { background: rgba(255, 255, 255, .12); border: 1px solid rgba(0, 0, 0, .06); border-radius: 14px; padding: 11px 12px; margin-bottom: 8px; }
.list-item .li-title { font-weight: 700; font-size: 14px; display: flex; justify-content: space-between; gap: 8px; }
.list-item .li-sub { color: var(--ink-2); font-size: 13px; margin-top: 2px; white-space: pre-wrap; word-break: break-word; }
.list-item .li-actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.mini-btn { border: 1px solid rgba(0, 0, 0, .12); background: rgba(255, 255, 255, .08); border-radius: 8px; padding: 4px 10px; font-size: 13px; color: var(--ink); }
.mini-btn.primary { background: var(--accent); color: #ffffff; border-color: var(--accent); }
.mini-btn.danger { color: #646464; border-color: rgba(100, 100, 100, .3); }
.actions-row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.actions-row button { flex: 1; padding: 11px 0; border-radius: 999px; border: 1px solid rgba(0, 0, 0, .1); background: rgba(255, 255, 255, .08); font-size: 15px; }
.actions-row button.primary { background: var(--accent); color: #ffffff; border-color: var(--accent); font-weight: 700; }
.actions-row button.danger { color: #646464; border-color: rgba(100, 100, 100, .3); background: rgba(100, 100, 100, .06); }
.note, .notice { background: rgba(97, 97, 97, .06); border: 1px solid rgba(97, 97, 97, .15); border-radius: 12px; padding: 10px 12px; font-size: 13px; color: var(--ink-2); margin: 8px 0; }
.warn { background: #f4f4f4; border: 1px solid #dadada; color: #6e6e6e; }
.err { background: rgba(100, 100, 100, .06); border: 1px solid rgba(100, 100, 100, .2); color: #2f2f2f; }
.kv { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; padding: 5px 0; border-bottom: 1px dashed rgba(0, 0, 0, .07); }
.kv b { font-weight: 600; }
.mono, .mono-block { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; background: rgba(0, 0, 0, .04); border-radius: 10px; padding: 10px 12px; }
pre.code { background: rgba(0, 0, 0, .04); border: 1px solid rgba(0, 0, 0, .06); border-radius: 10px; padding: 10px; font-size: 12px; overflow: auto; max-height: 300px; white-space: pre-wrap; word-break: break-word; }
.preview-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.preview-table td { padding: 5px 4px; border-bottom: 1px dashed rgba(0, 0, 0, .07); vertical-align: top; }
.preview-table td:first-child { color: var(--ink-2); white-space: nowrap; padding-right: 10px; }
details summary { cursor: pointer; font-size: 13px; color: var(--ink-2); padding: 6px 0; }

/* 外观页 */
.bg-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 8px; }
.bg-preset { padding: 12px 8px; border-radius: 14px; border: 1px solid rgba(0, 0, 0, .08); background: rgba(255, 255, 255, .08); font-size: 14px; }
.bg-preset.active { border-color: var(--accent); color: var(--accent-deep); background: var(--accent-softer); }
.slider-row { margin: 12px 0; }
.slider-head { display: flex; justify-content: space-between; font-size: 13px; color: var(--ink-2); margin-bottom: 6px; }
.slider-val { color: var(--ink-3); }
input[type="range"] { width: 100%; accent-color: var(--accent); margin: 0; }
.color-row { margin: 12px 0; }
.color-label { font-size: 13px; color: var(--ink-2); margin-bottom: 6px; }
.swatch-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.swatch { width: 32px; height: 32px; border-radius: 50%; border: 2px solid rgba(0, 0, 0, .08); cursor: pointer; padding: 0; }
.swatch.active { border-color: var(--ink); box-shadow: 0 0 0 2px #ffffff, 0 0 0 4px var(--accent); }
.color-picker { width: 32px; height: 32px; border: none; border-radius: 50%; padding: 0; background: none; cursor: pointer; }

/* 设计变量页 */
.token-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 8px; }
.token-cell { display: flex; align-items: center; gap: 8px; font-size: 12.5px; min-width: 0; }
.token-swatch { width: 22px; height: 22px; border-radius: 7px; border: 1px solid rgba(0, 0, 0, .1); flex-shrink: 0; }
.token-name { color: var(--ink-2); white-space: nowrap; }
.token-value { color: var(--ink-3); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; margin-left: auto; text-align: right; overflow: hidden; text-overflow: ellipsis; }

/* 导入：拖放区 + 粘贴 JSON */
.drop-zone { border: 1px dashed rgba(0, 0, 0, .2); border-radius: 12px; padding: 14px 10px; margin: 10px 0; text-align: center; color: var(--ink-3); font-size: 13px; }
.drop-zone.drag-over { border-color: var(--accent); background: rgba(97, 97, 97, .06); color: var(--ink); }
.paste-import { margin: 10px 0; }
.paste-import textarea { width: 100%; margin-top: 8px; }

/* 用 JS 触发的文件选择框不能 display:none：iOS Safari 上程序触发的点击
   常常打不开文件选择器。保持渲染、视觉上隐藏，点开才正常。 */
.file-input-hidden { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

/* 底部弹出层 / 弹窗 */
.sheet { position: absolute; inset: 0; background: rgba(39, 39, 39, .32); display: flex; align-items: flex-end; justify-content: center; z-index: 50; }
.sheet-card { width: 100%; border-radius: 28px 28px 0 0; padding: 14px 16px calc(16px + var(--sab)); max-height: 78dvh; overflow-y: auto; }
.sheet-title { font-weight: 700; text-align: center; margin-bottom: 10px; }
.action-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.action-grid button, .menu-list button { padding: 12px 0; border-radius: 14px; border: 1px solid rgba(0, 0, 0, .06); background: rgba(255, 255, 255, .08); font-size: 14px; }
.menu-list { display: flex; flex-direction: column; gap: 8px; }
.sheet-cancel { width: 100%; margin-top: 10px; padding: 12px 0; border-radius: 14px; border: none; background: rgba(119, 119, 119, .12); font-size: 15px; }
.sticker-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.sticker-cell { border: 1px solid rgba(0, 0, 0, .06); border-radius: 14px; padding: 6px 4px; background: rgba(255, 255, 255, .08); text-align: center; }
.sticker-cell img { width: 100%; height: 64px; object-fit: contain; }
.sticker-cell .nm { font-size: 12px; color: var(--ink-2); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* 表情包面板：搜索 + 分组 chips + 骨架 + 加载更多（4 列网格与圆角卡片风格不变）。 */
.sticker-tools { margin-bottom: 10px; }
#sticker-search { width: 100%; border: 1px solid rgba(0, 0, 0, .1); border-radius: 13px; padding: 9px 12px; background: rgba(255, 255, 255, .25); font-size: 14px; outline: none; }
#sticker-search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(97, 97, 97, .15); }
.sticker-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.sticker-chip { border: 1px solid rgba(0, 0, 0, .08); border-radius: 999px; padding: 5px 11px; background: rgba(255, 255, 255, .08); font-size: 12.5px; color: var(--ink-2); }
.sticker-chip.active { background: var(--ink); color: #ffffff; border-color: var(--ink); font-weight: 700; }
.sticker-cell .skel { height: 64px; border-radius: 8px; background: linear-gradient(90deg, rgba(0, 0, 0, .07) 25%, rgba(0, 0, 0, .02) 50%, rgba(0, 0, 0, .07) 75%); background-size: 200% 100%; animation: skel-shimmer 1.2s infinite linear; }
@keyframes skel-shimmer { to { background-position: -200% 0; } }
.sticker-empty { text-align: center; padding: 18px 0 6px; }
#sticker-more { margin-top: 10px; }
.modal { position: absolute; inset: 0; background: rgba(39, 39, 39, .32); display: flex; align-items: center; justify-content: center; z-index: 60; padding: 20px; }
.modal-card { border-radius: var(--r-md); width: 100%; max-width: 480px; max-height: 82dvh; display: flex; flex-direction: column; overflow: hidden; }
.modal-title { font-weight: 700; padding: 14px 16px 0; text-align: center; }
.modal-body { padding: 12px 16px; overflow-y: auto; font-size: 14px; }
.modal-body textarea, .modal-body input[type=text], .modal-body input[type=password], .modal-body input[type=number], .modal-body select { width: 100%; border: 1px solid rgba(0, 0, 0, .12); border-radius: 13px; padding: 8px 10px; margin: 4px 0 10px; background: #ffffff; min-height: 42px; outline: none; }
.modal-body textarea:focus, .modal-body input:focus, .modal-body select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(97, 97, 97, .15); }
.modal-body label { font-size: 13px; color: var(--ink-2); display: block; }
.modal-body textarea { min-height: 90px; resize: vertical; }
.modal-actions { display: flex; gap: 8px; padding: 0 16px 14px; }
.modal-actions button { flex: 1; padding: 11px 0; border-radius: 12px; border: 1px solid rgba(0, 0, 0, .1); background: rgba(255, 255, 255, .08); font-size: 15px; }
.modal-actions button.primary { background: var(--accent); color: #ffffff; border-color: var(--accent); font-weight: 700; }
.modal-actions button.danger { background: rgba(100, 100, 100, .06); color: #2f2f2f; border-color: rgba(100, 100, 100, .2); }

/* toast */

/* verweile — monochrome liquid / 조용히 머무는 공간

/* 深色壁纸可读性：不靠加厚白底，只提亮文字本身（浅色字 + 深色柔光晕）。

/* ===== A 组集成（2026-11-21）：长按菜单 / 反应 / 心声 / 新消息 pill / 聊天菜单 ===== */

/* iOS 式长按菜单：根节点由 LongPressMenu 挂在 body 下，position:fixed，
   坐标取自气泡 getBoundingClientRect（视口坐标），与 #app 的居中偏移无关。
   背景柔和虚化（backdrop blur + 淡黑），菜单与反应条分开排布。 */
.lp-menu-root { position: fixed; inset: 0; z-index: 70; pointer-events: none; }
.lp-menu-backdrop { position: absolute; inset: 0; background: rgba(30, 30, 30, .16); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); pointer-events: auto; }
.lp-reaction-bar { position: absolute; display: flex; align-items: center; gap: 2px; background: rgba(255, 255, 255, .94); border: 1px solid rgba(0, 0, 0, .05); border-radius: 999px; padding: 6px 8px; box-shadow: 0 8px 24px rgba(0, 0, 0, .18); pointer-events: auto; z-index: 2; }
.lp-reaction { font-size: 24px; line-height: 1; background: none; border: none; padding: 3px 4px; border-radius: 50%; }
.lp-reaction.active { background: rgba(0, 0, 0, .09); }
.lp-reaction-more { font-size: 20px; color: #3a3a3c; }
.lp-menu { position: absolute; width: 280px; max-width: calc(100vw - 16px); background: rgba(255, 255, 255, .94); border: 1px solid rgba(0, 0, 0, .06); border-radius: 14px; box-shadow: 0 12px 32px rgba(0, 0, 0, .20); overflow: hidden; pointer-events: auto; z-index: 2; color: #1d1d1f; }
.lp-menu-item { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; background: none; border: none; border-bottom: 1px solid rgba(0, 0, 0, .06); padding: 12px 16px; font-size: 16px; text-align: left; color: #1d1d1f; }
.lp-menu-item:last-child { border-bottom: none; }
.lp-menu-item:active { background: rgba(0, 0, 0, .05); }
.lp-menu-item.danger { color: #c0392b; }
.lp-menu-item.danger .lp-menu-icon { color: #c0392b; }
.lp-menu-icon { width: 22px; height: 22px; color: #3a3a3c; flex-shrink: 0; }
.lp-menu-secondary { border-top: 1px solid rgba(0, 0, 0, .08); }
/* B 组（2026-11-21）：长按菜单颜色与壁纸 tone 脱钩——菜单永远浅色、字永远深色。
   上面 .lp-menu / .lp-menu-item / .lp-menu-icon / .lp-reaction-more 全部写死固定色，
   不用 var(--ink) / var(--ink-2)，且全文件不许有命中菜单元素的 [data-tone] 规则。 */

/* B 组（2026-11-21）：紧凑 iOS 设置行 —— 一行一个设置，左文字（可带副文案）右 51×31 开关。
   开关轨道是 .switch-track（不是 input 本身），所以 .field input 的全宽文本框样式
   与 [data-tone=dark] .field input 再也拉不长它；input 藏在 label 里，只负责状态与事件。 */
.setting-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 52px; padding: 8px 0; border-bottom: 1px solid rgba(0, 0, 0, .06); }
.setting-row:last-child { border-bottom: none; }
.setting-label { flex: 1; min-width: 0; font-size: 15px; color: var(--ink); }
.setting-label small { display: block; font-size: 12px; color: var(--ink-2); margin-top: 2px; }
.switch { position: relative; display: inline-flex; flex-shrink: 0; width: 51px; height: 31px; cursor: pointer; }
.field label.switch, .setting-row label.switch { display: inline-flex; margin-top: 0; }
.switch input[type="checkbox"] { position: absolute; inset: 0; width: 51px; height: 31px; min-height: 31px; margin: 0; padding: 0; opacity: 0; }
.switch-track { display: block; width: 51px; height: 31px; border-radius: 999px; background: #e9e9ea; transition: background .2s; position: relative; flex-shrink: 0; }
.switch-track::after { content: ""; position: absolute; width: 27px; height: 27px; border-radius: 50%; background: #ffffff; top: 2px; left: 2px; transition: transform .2s; box-shadow: 0 1px 3px rgba(0, 0, 0, .2); }
.switch input[type="checkbox"]:checked + .switch-track { background: #34c759; }
.switch input[type="checkbox"]:checked + .switch-track::after { transform: translateX(20px); }
.switch input[type="checkbox"]:focus-visible + .switch-track { outline: 2px solid #34c759; outline-offset: 2px; }
/* 聊天设置弹窗里的设置行：占满整行，不再套 cm-row 的行样式 */
.cm-row .setting-row { flex: 1; padding: 0; border-bottom: none; min-height: 52px; }
/* 后备防线：.field 里的裸复选框也不许被 .field input 的全宽文本框样式拉长
   （本规则在文件后部，特异度与 [data-tone=dark] .field input 相同，靠顺序取胜）。 */
.field input[type="checkbox"] { width: 51px; height: 31px; min-height: 31px; padding: 0; background: #e9e9ea; border: none; border-radius: 999px; flex-shrink: 0; }
.field input[type="checkbox"]:checked { background: #34c759; }

/* B 组（2026-11-21）：长按选择抑制 —— 只禁气泡与菜单内元素的原生选词 / 呼出菜单。
   只有这三处能禁选：输入框 #input / textarea 不在其中，必须能正常选词粘贴。 */
.message-wrapper, .message-wrapper *,
.message-bubble, .message-bubble *,
.lp-menu-root, .lp-menu-root * {
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
}
/* 被操作气泡突出显示 */

/* 气泡下方的表情反应汇总（纯本地，点一下切换，重复点取消） */

#view-chat #quote-bar { position:absolute; left:0; right:0; bottom:var(--composer-height); z-index:11; display:flex; flex-direction:column; align-items:flex-start; gap:5px; margin:0; padding:24px 20px; border:0; background:none; box-shadow:none; color:var(--im-label); }
#view-chat .reply-preview-name { padding:0 3px; font-size:11px; line-height:16px; color:var(--im-secondary); }
#view-chat .reply-preview-content { max-width:74%; padding:7px 12px; border-radius:18px; background:var(--im-received); color:var(--im-received-ink); }
#view-chat .reply-preview-text { display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden; overflow-wrap:anywhere; font-size:15px; line-height:1.38; }
#view-chat #quote-bar[data-sender=user] { align-items:flex-end; }
#view-chat #quote-bar[data-sender=user] .reply-preview-content { background:var(--im-sent); color:var(--im-sent-ink); }
#view-chat #quote-cancel { position:absolute; right:5px; top:-14px; width:44px; height:44px; display:flex; align-items:center; justify-content:center; border:0; border-radius:50%; background:none; color:var(--im-secondary); font-size:25px; }
#view-chat #quote-bar[data-sender=user] #quote-cancel { right:auto; left:5px; }
#view-chat .quote-navigation { position:absolute; bottom:calc(var(--composer-height) + 9px); left:50%; transform:translateX(-50%); z-index:9; display:flex; gap:1px; width:max-content; max-width:calc(100% - 24px); border:1px solid var(--im-divider); border-radius:20px; background:var(--im-chrome); box-shadow:0 3px 12px #0001; overflow:hidden; }
#view-chat .quote-navigation button { min-height:36px; padding:6px 12px; border:0; background:none; color:var(--im-label); font-size:12px; white-space:nowrap; }
#view-chat .quote-return-btn { border-right:1px solid var(--im-divider)!important; }
#view-chat .msg.quote-target .msg-body { animation:quotePulse 1.8s ease-out; border-radius:18px; }
#view-chat.is-replying .quote-navigation { display:none; }
@keyframes quotePulse { 0%,45%{box-shadow:0 0 0 5px rgba(128,128,128,.25)} 100%{box-shadow:0 0 0 10px transparent} }
#view-chat .new-msg-pill { bottom:70px; }
#view-chat .msg.context-disabled { opacity:.45; }
#view-chat .msg-reactions { display:flex; gap:3px; margin:3px 0 0; }
#view-chat .msg.sent .msg-reactions { align-self:flex-end; }
#view-chat .reaction-chip { padding:2px 6px; border:1px solid var(--im-divider); border-radius:12px; background:var(--im-input); color:var(--im-label); font-size:12px; }
#view-chat .inner-voice-btn { background:none; border:0; padding:3px; color:var(--im-secondary); font-size:11px; }
#view-chat .msg, #view-chat .msg * { -webkit-touch-callout:none; -webkit-user-select:none; user-select:none; }
/* Optional liquid material is isolated from default opaque iMessage bubbles. */
#app.bubble-glass #view-chat .bubble { --im-fill:var(--bubble-ai); background:var(--im-fill); color:var(--bubble-ai-ink); backdrop-filter:blur(5px); -webkit-backdrop-filter:blur(5px); border:1px solid rgba(128,128,128,.18); }
#app.bubble-glass #view-chat .msg.sent .bubble { --im-fill:var(--bubble-me); background:var(--im-fill); color:var(--bubble-me-ink); }
/* Menu belongs to its own surface; never inherit white text onto a white menu. */
.lp-menu { background:rgba(248,248,248,.95); color:#171717; border:1px solid #ffffff90; border-radius:16px; box-shadow:0 12px 40px #0002; }
.lp-menu-item { color:#171717; -webkit-text-fill-color:currentColor; opacity:1; font-size:16px; font-weight:400; min-height:45px; }
.lp-menu-item .icon { color:inherit; opacity:1; }
.lp-menu-item.danger { color:#d42b23; }
.lp-menu-item:disabled { opacity:.4; }
[data-tone=dark] .lp-menu { background:rgba(44,44,46,.97); color:#f5f5f5; }
[data-tone=dark] .lp-menu-item { color:#f5f5f5; }
[data-tone=dark] .lp-menu-item.danger { color:#ff6961; }
@media(max-width:359px) { #view-chat .msg-body{max-width:86%;} #view-chat #message-area{padding-left:16px;padding-right:16px;} }
@media(prefers-reduced-motion:reduce){#view-chat *,#view-chat *::before{animation:none;transition:none;}}

/* Default chat is clean paper; choosing a wallpaper keeps that image visible. */
[data-chat-wallpaper=plain] #view-chat { background:#fff; }
[data-chat-wallpaper=plain][data-tone=dark] #view-chat { background:#000; }
body:has(#app.in-chat)::before { content:none; }
#view-chat .msg-delivered { color:var(--im-secondary); font-size:10px; line-height:15px; margin:3px 4px 0; }
#view-chat .msg.selected .msg-body { outline:2px solid var(--im-secondary); outline-offset:4px; border-radius:19px; }
#view-chat .msg-retry { border:0; padding:3px; background:none; color:#c43830; font-size:12px; }

#view-chat .transfer-card, #view-chat .gift-card { position:relative; width:210px; max-width:100%; min-height:139px; padding:14px; border:1px solid var(--im-divider); border-radius:19px; background:linear-gradient(135deg,#bfbfbf,#a6a6a6); color:#fff; box-shadow:none; }
#view-chat .card .card-sub, #view-chat .card .card-label, #view-chat .card .card-status { color:inherit; }

#view-chat .card .card-amount { font-size:30px; }
#view-chat .card.placeholder-card { max-width:240px; color:var(--im-label); }
.lp-menu { max-height:calc(100dvh - 160px); overflow-y:auto; }

}

body:has(#app.in-chat) { overflow:hidden; display:flow-root; }

#app.in-chat .status-popup { padding-bottom:calc(12px + var(--sab)); }

#view-chat .card-status { font-size:11px; }

#view-chat .placeholder-card summary { cursor:pointer; font-size:12px; margin-top:8px; }
#view-chat .reaction-chip.mine { background:var(--im-divider); }

#view-chat .iv-head, #view-chat .iv-note { color:var(--im-secondary); }

#app.in-chat .status-popup .ghost-btn:disabled { opacity:.35; pointer-events:none; }

#view-chat .msg.is-streaming .bubble { white-space:pre-wrap; }
.lp-menu-label { flex:1; min-width:0; }
.lp-menu-more { font-weight:400; }

<script type="module">

/* ===== js/utils.js ===== */
// utils.js — 环境无关的小工具（浏览器与 Node 测试共用）
const pad = (n) => String(n).padStart(2, '0');

function uid(prefix = 'msg') {
  return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 9)}`;
}

function generateUUID() {
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, (c) => {
    const r = Math.random() * 16 | 0;
    const v = c === 'x' ? r : (r & 0x3 | 0x8);
    return v.toString(16);
  });
}

/** 设备本地时间（用户时区），格式：2026年11月19日 23:42。不硬编码服务器时间。 */
function nowTimeString(date = new Date()) {
  return `${date.getFullYear()}年${pad(date.getMonth() + 1)}月${pad(date.getDate())}日 ${pad(date.getHours())}:${pad(date.getMinutes())}`;
}

function formatTimeDivider(timestamp) {
  const date = new Date(timestamp);
  const now = new Date();
  const isToday = date.toDateString() === now.toDateString();
  const yesterday = new Date(now);
  yesterday.setDate(now.getDate() - 1);
  const isYesterday = date.toDateString() === yesterday.toDateString();
  const timeStr = `${pad(date.getHours())}:${pad(date.getMinutes())}`;
  if (isToday) return timeStr;
  if (isYesterday) return `昨天 ${timeStr}`;
  if (date.getFullYear() === now.getFullYear()) return `${date.getMonth() + 1}月${date.getDate()}日 ${timeStr}`;
  return `${date.getFullYear()}年${date.getMonth() + 1}月${date.getDate()}日 ${timeStr}`;
}

function formatTimeGap(ms) {
  const s = Math.floor(ms / 1000);
  const m = Math.floor(s / 60);
  const h = Math.floor(m / 60);
  const d = Math.floor(h / 24);
  if (d > 0) return `${d}天${h % 24}小时`;
  if (h > 0) return `${h}小时${m % 60}分钟`;
  if (m > 0) return `${m}分钟`;
  return `${s}秒`;
}

/** UWU 原 countTextTokens：中文 1.2 / 其他 0.4，估算值。调用方必须标注“估算”。 */
function countTextTokens(text) {
  if (!text) return 0;
  const chinese = (text.match(/[\u4e00-\u9fa5]/g) || []).length;
  const other = text.length - chinese;
  return Math.ceil(chinese * 1.2 + other * 0.4);
}

/** maxMemory 可能是字符串 '80'：转换并校验，无效时回落 80。 */
function parseMaxMemory(value, fallback = 80) {
  const n = typeof value === 'string' ? Number(value.trim()) : Number(value);
  if (!Number.isFinite(n) || n <= 0) return fallback;
  return Math.min(500, Math.floor(n));
}

function clampInt(value, min, max, fallback) {
  const n = Number(value);
  if (!Number.isFinite(n)) return fallback;
  return Math.min(max, Math.max(min, Math.floor(n)));
}

function escapeHtml(s) {
  return String(s ?? '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

/** 简单稳定的字符串哈希（用于状态模板去重、缺 ID 记录的稳定识别）。 */
function hashString(s) {
  let h = 5381;
  const str = String(s ?? '');
  for (let i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) >>> 0;
  return h.toString(36);
}

/** 从多个逗号分隔的 Key 中随机取一个（UWU 原 getRandomValue）。 */
function pickKey(str) {
  if (str && String(str).includes(',')) {
    const arr = String(str).split(',').map((x) => x.trim()).filter(Boolean);
    return arr[Math.floor(Math.random() * arr.length)];
  }
  return str;
}

function friendlyErrorMessage(error) {
  if (!error) return '发生了未知错误。';
  if (error.name === 'AbortError' || error.message === 'aborted') return '已停止生成。';
  const status = error.status ?? error.response?.status;
  if (status) {
    switch (status) {
      case 400: return '请求参数有误 (400)，通常是模型名不对或发送内容过长。';
      case 401: return 'API 密钥无效 (401)，请检查 API 设置中的 Key。';
      case 403: return '访问被拒绝 (403)，可能是密钥权限不足。';
      case 404: return 'API 地址错误 (404)，请检查 Base URL。';
      case 429: return '请求太频繁 (429)，触发了速率限制，请稍等再试。';
      case 500: return '服务器内部错误 (500)，服务商那边出问题了。';
      case 502: return '网关错误 (502)，服务商网络异常。';
      case 503: return '服务暂时不可用 (503)，可能正在维护或过载。';
      case 504: return '网关超时 (504)，服务器响应太慢。';
      default: return `服务器返回错误 (状态码 ${status})，请稍后再试。`;
    }
  }
  if (error instanceof TypeError || /failed to fetch|networkerror|load failed/i.test(error.message || '')) {
    return '无法连接到服务器，请检查网络或 API 地址。';
  }
  if (/HTML|<!doctype|<html/i.test(error.message || '')) {
    return 'API 返回了网页 HTML 而不是 JSON，请检查 Base URL 是否正确。';
  }
  return error.message || '发生了未知错误。';
}

/* ===== js/statusBar.js ===== */
// statusBar.js — 自定义状态栏渲染（浏览器与 Node 测试共用，纯函数，不依赖 DOM）。
//
// 渲染链路：模型输出的原始状态文本 --(regexPattern 匹配)--> m --(replacePattern $n 替换)-->
// 状态 HTML --(buildStatusDocument 打包成完整文档)--> 沙箱 iframe 的 srcdoc。
// 模板 HTML 绝不直接 innerHTML 进主页面；它只活在 sandbox="allow-scripts"
// 且不带 allow-same-origin 的 iframe 里，因此拿不到主页面、聊天数据与 API Key。

const STATUS_HEIGHT_MSG = 'verweile-status-height';
const STATUS_ERROR_MSG = 'verweile-status-error';

/** 解析 regexPattern：支持不带斜杠的裸正则与 /pattern/flags 两种写法。
 *  未写 flags 时默认 'gs'（s 保证多行内容能被 . 匹配到）；写了 flags 也补上 s。 */
function parseStatusPattern(patternText) {
  let pattern = String(patternText ?? '');
  let flags = 'gs';
  const mp = pattern.match(/^\/(.*?)\/([a-z]*)$/s);
  if (mp) {
    pattern = mp[1];
    flags = mp[2] || 'gs';
    if (!flags.includes('s')) flags += 's';
  }
  return { pattern, flags };
}

/** 用模板对原始状态文本做一次匹配 + $n 替换。无匹配返回 null；正则非法时抛错（调用方捕获）。
 *  opts.ctx 可带角色信息时，还会按原始 UWU 的 processTemplate 做变量替换：
 *  {{user_avatar}}/{{char_avatar}}/{{user_name}}/{{char_name}}/{{char_remark}}/{{user_remark}}
 *  以及 <user-avatar>/<char-avatar> 标签。 */
function applyStatusTemplate(raw, panel, ctx) {
  if (!panel?.regexPattern) return null;
  const { pattern, flags } = parseStatusPattern(panel.regexPattern);
  const re = new RegExp(pattern, flags);
  const m = re.exec(String(raw ?? ''));
  if (!m) return null;
  let html = String(panel.replacePattern || '').replace(/\$(\d+)/g, (_, gi) => (m[Number(gi)] !== undefined ? m[Number(gi)] : `$${gi}`));
  if (ctx) html = substituteTemplateVars(html, ctx);
  return { raw: m[0], html };
}

/** 合并头像标签自带的属性：class 与标记类合并成一个 class 属性。
 *  直接拼接会产生两个 class 属性，浏览器只认第一个，模板自己的样式类就丢了
 *  （例如 <char-avatar class="thx-ava"> 的 thx-ava 会失效）。 */
function mergeAvatarAttrs(attrs, markerClass) {
  const a = String(attrs || '');
  const m = a.match(/class\s*=\s*(?:"([^"]*)"|'([^']*)')/i);
  if (!m) return ` class="${markerClass}"${a}`;
  const rest = a.replace(/class\s*=\s*(?:"[^"]*"|'[^']*')/i, '').trim();
  return ` class="${markerClass} ${(m[1] ?? m[2]).trim()}"${rest ? ` ${rest}` : ''}`;
}

/** 原始 UWU processTemplate 的变量替换：头像与名字进模板。
 *  缺名字时用原始 UWU 的默认值（User/Character）；缺头像时把 <…-avatar> 标签
 *  换成空 span（不留破图、不留字面量占位符）。 */
function substituteTemplateVars(html, ctx = {}) {
  const userAvatar = ctx.userAvatar || '';
  const charAvatar = ctx.charAvatar || '';
  const userName = ctx.userName || 'User';
  const userRemark = ctx.userRemark || userName;
  const charName = ctx.charName || 'Character';
  const charRemark = ctx.charRemark || charName;
  let out = String(html ?? '');
  out = out.replace(/{{user_avatar}}/g, userAvatar);
  out = out.replace(/{{char_avatar}}/g, charAvatar);
  out = out.replace(/{{user_name}}/g, userName);
  out = out.replace(/{{char_name}}/g, charName);
  out = out.replace(/{{char_remark}}/g, charRemark);
  out = out.replace(/{{user_remark}}/g, userRemark);
  out = out.replace(/<user-avatar([^>]*)>\s*(?:<\/user-avatar>)?/gi, (_, attrs) =>
    (userAvatar ? `<img src="${userAvatar}"${mergeAvatarAttrs(attrs, 'uwu-user-avatar')}>` : `<span${mergeAvatarAttrs(attrs, 'uwu-avatar-empty')}></span>`));
  out = out.replace(/<char-avatar([^>]*)>\s*(?:<\/char-avatar>)?/gi, (_, attrs) =>
    (charAvatar ? `<img src="${charAvatar}"${mergeAvatarAttrs(attrs, 'uwu-char-avatar')}>` : `<span${mergeAvatarAttrs(attrs, 'uwu-avatar-empty')}></span>`));
  return out;
}

/** 弹窗里可翻看的状态条目：history（最新在前）优先；没有 history 时退回当前一条。 */
function statusViewEntries(sp = {}) {
  const hist = Array.isArray(sp.history) ? sp.history.filter((h) => h && (h.html || h.raw)) : [];
  if (hist.length) return hist.slice(0, 20);
  if (sp.currentStatusHtml || sp.currentStatusRaw) {
    return [{ raw: sp.currentStatusRaw || '', html: sp.currentStatusHtml || '', timestamp: Date.now() }];
  }
  return [];
}

/** 把浏览下标夹在 [0, total-1] 内；没有条目时固定 0。 */
function clampStatusIndex(i, total) {
  if (!total || total <= 0) return 0;
  return Math.max(0, Math.min(total - 1, Math.floor(i) || 0));
}

/** 从原始状态派生一句简短纯文本摘要，供顶栏简略状态条使用。
 *  去掉 style/script 整块、所有标签与协议外壳，折叠空白后按字符截断。 */
function summarizeStatus(raw, maxLen = 24) {
  let s = String(raw ?? '');
  s = s.replace(/<(style|script)\b[^>]*>[\s\S]*?<\/\1\s*>/gi, '');
  s = s.replace(/<[^>]*>/g, '');
  s = s.replace(/&nbsp;/gi, ' ').replace(/&amp;/gi, '&').replace(/&lt;/gi, '<').replace(/&gt;/gi, '>').replace(/&quot;/gi, '"').replace(/&#39;/g, "'");
  s = s.replace(/^\[.*?[:：]/, '').replace(/\]$/, '');
  s = s.replace(/\{[^{}]*\}/g, '');
  s = s.replace(/\s+/g, ' ').trim();
  const n = Math.max(4, Math.floor(maxLen) || 24);
  const chars = [...s];
  if (chars.length > n) s = chars.slice(0, n).join('') + '…';
  return s;
}

// iframe 内部的隔离样式：只管住布局与横向溢出，不碰模板的配色与排版。
// 注入位置在模板 <head> 内容之后、同级选择器下，模板自己的样式仍可覆盖外观；
// 只有 max-width 一项用 !important，确保固定宽度在手机面板里一定被夹住。
const STATUS_FRAME_CSS = [
  'html,body{margin:0;padding:0;background:transparent;width:100%;overflow-x:hidden;-webkit-text-size-adjust:100%}',
  'body>*{max-width:100%!important;box-sizing:border-box}',
  'img,svg,video,canvas{max-width:100%}',
  'pre,code{white-space:pre-wrap;word-break:break-word}',
  'table{max-width:100%}',
].join('\n');

// iframe 内部的高度上报脚本：用子元素 rect 实测内容高度（与视口无关，
// 内容收起后高度也能正确回落），变化时 postMessage 给父页面。
// ResizeObserver 监听全部后代 + MutationObserver 补新节点 + load 事件 + 兜底定时器，
// 覆盖图片加载、details 折叠、标签切换等场景。
// 注意：错误上报单独放在 head 里的首个脚本（见 STATUS_HEAD_SCRIPT），
// 因为模板脚本可能在 body 解析时就抛错——那时本脚本还没执行到。
const STATUS_FRAME_SCRIPT = `(function(){
  var MSG='${STATUS_HEIGHT_MSG}';
  function contentHeight(){
    var body=document.body; if(!body) return 0;
    var top=body.getBoundingClientRect().top, max=0, i, r, mb, b;
    var kids=body.children;
    for(i=0;i<kids.length;i++){
      r=kids[i].getBoundingClientRect();
      mb=0; try{ mb=parseFloat(getComputedStyle(kids[i]).marginBottom)||0; }catch(e){}
      b=r.bottom-top+mb; if(b>max) max=b;
    }
    return Math.max(0, Math.ceil(max));
  }
  function post(){ try{ parent.postMessage({type:MSG,height:contentHeight()},'*'); }catch(e){} }
  var raf=false;
  function schedule(){ if(raf) return; raf=true; requestAnimationFrame(function(){ raf=false; post(); }); }
  try{
    var ro=('ResizeObserver' in window)?new ResizeObserver(schedule):null;
    var mo=('MutationObserver' in window)?new MutationObserver(function(){ observe(); schedule(); }):null;
    function observe(){
      if(!ro||!document.body) return;
      ro.disconnect();
      var els=document.body.querySelectorAll('*');
      for(var i=0;i<els.length&&i<800;i++){ try{ ro.observe(els[i]); }catch(e){} }
      try{ ro.observe(document.body); }catch(e){}
    }
    observe();
    if(mo&&document.body) mo.observe(document.body,{childList:true,subtree:true,attributes:true,characterData:true});
    window.addEventListener('load',function(){ observe(); schedule(); });
    document.addEventListener('load',schedule,true);
    setTimeout(schedule,100); setTimeout(schedule,600);
    schedule();
  }catch(e){ post(); }
})();`;

// head 首个脚本：只装错误上报。必须在模板任何脚本之前执行，
// 否则模板在解析期抛错时监听器还没装上，父页面收不到错误。
const STATUS_HEAD_SCRIPT = `(function(){window.addEventListener('error',function(ev){try{parent.postMessage({type:'${STATUS_ERROR_MSG}',message:String((ev&&ev.message)||'error')},'*');}catch(e){}});})();`;

// 纵深防御的 CSP：iframe 已是沙箱不透明源，这里再禁掉联网提交与嵌套框架；
// 图片/字体/媒体允许 data: 与 https:，脚本与样式允许内联与 https:，保证模板常用能力可用。
const STATUS_CSP = "default-src 'none'; script-src 'unsafe-inline' https: http:; style-src 'unsafe-inline' https: http:; img-src data: blob: https: http:; font-src data: https: http:; media-src data: blob: https: http:; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'";

/** 只保留 body 标签上展示用的 class/id/内联样式（去掉危险写法），其余属性丢弃。 */
function pickBodyAttrs(attrStr) {
  const out = [];
  const cls = String(attrStr).match(/class\s*=\s*(?:"([^"]*)"|'([^']*)')/i);
  if (cls) out.push(`class="${(cls[1] ?? cls[2]).replace(/"/g, '&quot;')}"`);
  const id = String(attrStr).match(/id\s*=\s*(?:"([^"]*)"|'([^']*)')/i);
  if (id) out.push(`id="${(id[1] ?? id[2]).replace(/"/g, '&quot;')}"`);
  const style = String(attrStr).match(/style\s*=\s*(?:"([^"]*)"|'([^']*)')/i);
  if (style) {
    const raw = (style[1] ?? style[2]).replace(/url\s*\(|expression\s*\(|javascript\s*:|@import/gi, '');
    out.push(`style="${raw.replace(/"/g, '&quot;')}"`);
  }
  return out.length ? ' ' + out.join(' ') : '';
}

/** 把状态 HTML（完整文档或片段）打包成可放进沙箱 iframe srcdoc 的完整文档。
 *  完整文档：抽取 <head> 与 <body>（保留模板的 style/class/id/内联样式、
 *  CSS 变量、伪元素、动画、媒体查询、图片、内联 SVG、details/summary、
 *  表单控件与脚本），去掉 <base>，再套上隔离样式与高度上报脚本。
 *  片段：直接作为 body 内容。opts.marker 会以注释形式插在 body 开头，
 *  用于父页面强制刷新同一份 srcdoc。opts.frameId 会带进高度上报消息，
 *  供父页面把高度路由到对应的 iframe（聊天页 HTML 卡片用；状态栏弹窗不传，
 *  沿用原来的无 id 上报格式）。 */
function buildStatusDocument(html, opts = {}) {
  const input = String(html ?? '');
  const isFullDoc = /<!doctype html|<html[\s>]/i.test(input);
  let headInner = '';
  let bodyInner = input;
  let bodyAttrs = '';
  if (isFullDoc) {
    const headMatch = input.match(/<head[^>]*>([\s\S]*?)<\/head\s*>/i);
    if (headMatch) headInner = headMatch[1];
    const bodyMatch = input.match(/<body([^>]*)>([\s\S]*?)<\/body\s*>/i);
    if (bodyMatch) {
      bodyAttrs = pickBodyAttrs(bodyMatch[1]);
      bodyInner = bodyMatch[2];
    } else {
      bodyInner = input
        .replace(/<!doctype html[^>]*>/i, '')
        .replace(/<\/?html[^>]*>/gi, '')
        .replace(/<head[^>]*>[\s\S]*?<\/head\s*>/i, '');
    }
  }
  headInner = headInner.replace(/<base\b[^>]*>/gi, '');
  const marker = opts.marker ? '<' + '!--' + String(opts.marker).replace(/--/g, '') + '-->' : '';
  const heightScript = opts.frameId
    ? STATUS_FRAME_SCRIPT.replace(
      `parent.postMessage({type:MSG,height:contentHeight()},'*')`,
      `parent.postMessage({type:MSG,height:contentHeight(),frame:${JSON.stringify(String(opts.frameId))}},'*')`,
    )
    : STATUS_FRAME_SCRIPT;
  // 注意：下面拼接的闭合 script 标签必须写成反斜杠转义形式，注释标记也要拆开写——
  // dist 是把 bundle 内联进 script 元素的单文件，字面量会提前闭合外层 script，
  // 导致整包截断（SyntaxError: Unexpected end of input）。运行时拼出的仍是正常字符串。
  return '<!DOCTYPE html><html><head><meta charset="utf-8">'
    + '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">'
    + `<meta http-equiv="Content-Security-Policy" content="${STATUS_CSP}">`
    + `<script>${STATUS_HEAD_SCRIPT}<\/script>`
    + headInner
    + `<style>\n${STATUS_FRAME_CSS}\n</style>`
    + `</head><body${bodyAttrs}>${marker}${bodyInner}<script>${heightScript}<\/script></body></html>`;
}

/* ===== js/promptTemplates.js ===== */
// promptTemplates.js — TT 与默认 UWU 两套提示词的只读基线。
// 来源：uwu_reference/js/modules/chat_ai_prompt.js generatePrivateSystemPrompt。
// 原则：先复现原始措辞，只裁剪本阶段未实现的能力（朋友圈、代付/主动下单、
// 转发聊天记录、视频/语音通话、HTML 模块、思维链），并重新编号；不混成一个新模板，
// 不擅自重写角色关系。用户编辑的是覆盖层，见 promptBuilder.js。
//
// ctx 字段：
// realName, myName, status, persona, myPersona, currentTime,
// worldBooks: { limitBreak, before, after, guidelines}（已按 depth 排好序的纯文本）,
// stickerNames: string[]（当前允许角色使用的表情包名；空则不写表情包段）,
// galleryNames: string[]（角色相册名）, useRealGallery: boolean,
// statusSuffix: string（状态栏 promptSuffix）, bilingual: boolean,
// replyMin, replyMax, replyCountEnabled

const PROMPT_VERSIONS = ['tt', 'uwu'];

function buildTTPrompt(ctx) {
const c = ctx;
const wb = c.worldBooks || {};
let prompt = '';
if (wb.limitBreak) prompt += `${wb.limitBreak}\n`;

prompt += `[世界定义]\n一个真实的线上聊天软件。\n当前时间：现在是 ${c.currentTime}。你应知晓当前时间，但除非对话内容明确相关，否则不要主动提及或评论时间（例如，不要催促我睡觉）\n当前你主控的名字是：${c.realName}，正在与你聊天的是：${c.myName}。\n\n`;

prompt += `[创作要领]\n从第一性原则出发，当前为沉浸式线上rp，保持角色人格＞迎合讨好${c.myName}。\n\n`;
prompt += `[rule=正确理解]\n - 对于${c.myName}的积极情绪/爱意/抽象玩梗/谐音/玩笑，不调侃不询问不质疑不落地，根据${c.realName}的性格，**直接回应**${c.realName}对应的情绪/有样学样/接梗/其他反应。\n - 通常维持日常感，停留在表面，不升华不做过度理解。\n - 优先理解意图而非情绪\n\n`;

prompt += `<消息格式库>\n需遵循的消息格式如下：\n`;
prompt += `1.普通消息：[${c.realName}的消息：你好呀]\n`;
prompt += `2.撤回消息: [${c.realName}撤回了一条消息：被撤回的消息内容]\n`;
if (c.useRealGallery && c.galleryNames && c.galleryNames.length > 0) {
prompt += `3.图片消息: [${c.realName}发来的照片/视频：图片描述或相册图片名称] (相册中有：[${c.galleryNames.join(', ')}])\n`;
} else {
prompt += `3.图片消息: [${c.realName}发来的照片/视频：图片描述]\n`;
}
prompt += `4.语音消息: [${c.realName}的语音：语音内容]\n`;
prompt += `5.引用消息: [${c.realName}引用“引用的内容”并回复：回复的内容]\n - 当${c.myName}发送多条消息且包含多个信息点时，灵活运用引用消息，单条回复无需引用。\n - 在进行引用消息的前提下前后回复顺序颠倒。\n - 可以进行多次引用。\n`;
if (c.bilingual) {
prompt += `6.双语消息: [${c.realName}的消息：外语原文「中文翻译」]\n - 当${c.realName}的母语为中文以外的语言时，你的消息回复**必须**严格遵循双语消息格式，该消息等同于普通消息。⭐️此条规则的优先级最高！！⭐️\n - 中文翻译文本视为系统自翻译，不视为角色的原话；当你的角色想要说中文时，需要根据你的角色设定自行判断对于中文的熟悉程度来造句，并使用普通消息的格式。\n`;
}
prompt += `7.转账消息: [${c.realName}的转账：金额元；备注：转账备注]\n`;
prompt += `8.礼物消息: [${c.realName}送来的礼物：礼物描述]\n`;
prompt += `9.状态更新: [${c.realName}更新状态为：新状态]\n`;
prompt += `10.隐藏指令(不显示给用户，但必须回复以触发状态变化):\n - 接收礼物: [${c.realName}已接收礼物]\n - 接收/退回转账: [${c.realName}接收${c.myName}的转账] 或 [${c.realName}退回${c.myName}的转账]\n`;
prompt += `</消息格式库>\n\n`;

prompt += `<参考资料>\n`;
if (wb.before) prompt += `${wb.before}\n`;
prompt += `<角色设定>\n`;
prompt += `你的角色名是：${c.realName}。你的当前状态是：${c.status}。\n`;
prompt += `你的角色设定是：${c.persona || '无'}\n`;
if (wb.after) prompt += `${wb.after}\n`;
prompt += `</角色设定>\n\n`;

if (c.stickerNames && c.stickerNames.length > 0) {
prompt += `<表情包格式>\n表情包: [${c.realName}的表情包：表情包名称] (名称必须从以下列表中选择：[${c.stickerNames.join(', ')}])\n</表情包格式>\n`;
}
if (c.statusSuffix) {
prompt += `<状态栏格式>\n额外输出要求：${c.statusSuffix}\n</状态栏格式>\n\n`;
}

prompt += `<用户人设>\n关于我的人设：${c.myPersona}\n</用户人设>\n\n`;
}
prompt += `</参考资料>\n\n`;

if (c.favoritedJournals) {
prompt += `<剧情记忆>\n这是你需要长期记住的、我们之间发生过的往事背景：\n${c.favoritedJournals}\n</剧情记忆>\n\n`;

prompt += `<相关记忆>\n${c.relatedMemories}\n</相关记忆>\n\n`;

prompt += `【动态插入: 聊天记录】\n\n`;

prompt += `[破开套路]\n本次回复必须与历史记录的最后一轮${c.realName}回复在【消息条数】、【其他消息格式出现位置】做出区别。对于除普通消息以外的消息格式，杜绝出现在同一位置。（如回复五条消息，引用消息一直是第一条这种情况）\n`;
prompt += `---准则结束---\n\n`;

const minReply = c.replyMin || 3;
const maxReply = c.replyMax || 8;
prompt += `[对话节奏]\n- 风格：模拟真人聊天节奏\n- 数量：${minReply}-${maxReply}条短消息，保持回复消息数量的随机性，勿陷入固定套路\n- 格式：普通消息为主，其他消息为辅，当最近聊天略显单调时，主动运用其他消息丰富对话、推进剧情\n- 当开启长文本消息时，输出可附带旁白的${c.realName}视角描写\n- 尾声：留给${c.myName}回应的空间\n\n`;

prompt += `现在，根据用户的最新发言，继续对话吧。\n`;

if (c.myName) prompt = prompt.replace(/\{\{user\}\}/gi, c.myName);
return prompt;
}

// statusMode.js — 状态三模式：concise（简洁默认）/ inner（心声）/ html（HTML 状态栏）。
//
// 设置键设计（存在角色对象 char 上，随 saveCharacter() 一起持久化）：
// - char.statusMode：'concise' | 'inner' | 'html'，默认 'concise'。
// - char.innerVoicePrompt：心声模式的提示词（可编辑），默认 DEFAULT_INNER_VOICE_PROMPT。
// - char.statusPanel：现有 HTML 状态模板（regexPattern / replacePattern /
//   promptSuffix / history 等），html 模式复用它，不另造一套协议。
//   切换模式只改 char.statusMode 这一个选择字段，不删除模板、不删除历史、
//   不动 innerVoicePrompt（切回来还能继续用）。
//
// 提示词组装：按模式只返回一套指令。concise 返回空串（不注入任何状态指令）；
// inner 返回心声生成指令；html 返回现有状态模板指令（即 statusPanel.promptSuffix，
// promptBuilder.js:557 已把它接成 statusSuffix）。

/** 三种模式。 */
const STATUS_MODES = ['concise', 'inner', 'html'];
/** 默认模式：简洁（什么都不注入，回复里不带状态/心声）。 */
const DEFAULT_STATUS_MODE = 'concise';

/** 模式中文名（供设置页下拉/分段选择用）。 */
const STATUS_MODE_LABELS = {
  concise: '简洁',
  inner: '心声',
  html: 'HTML 状态栏',
};

/** 心声模式的默认提示词（可编辑，存在 char.innerVoicePrompt）。 */
const DEFAULT_INNER_VOICE_PROMPT =
  '在回复末尾另起一段，用 [inner_voice]…[/inner_voice] 包裹 1–3 句以角色口吻写的本轮内心独白；'
  + '独白只写内心所想，不复述对话、不解释、不提及指令。';

/** html 模式无 promptSuffix 时的兜底：沿用现有状态协议的措辞，不发明新标记。 */
const DEFAULT_HTML_STATUS_PROMPT =
  '在回复末尾按状态栏模板输出状态。';

/** 把任意值规范化为合法模式；非法/缺失一律回落到 concise。 */
function normalizeStatusMode(value) {
  return STATUS_MODES.includes(value) ? value : DEFAULT_STATUS_MODE;
}

/** 取角色当前的状态模式（默认 concise）。 */
function getStatusMode(character = {}) {
  return normalizeStatusMode(character?.statusMode);
}

/**
 * 切换模式：返回一个新角色对象（不改原对象），只改 statusMode 字段。
 * 模板（statusPanel）、历史（statusPanel.history）、心声提示词
 * （innerVoicePrompt）原样保留，切回来还能继续用。
 */
function setStatusMode(character = {}, mode) {
  return { ...character, statusMode: normalizeStatusMode(mode) };
}

/** 取角色的心声提示词（可编辑；空值回落到默认）。 */
function getInnerVoicePrompt(character = {}) {
  const p = String(character?.innerVoicePrompt ?? '').trim();
  return p || DEFAULT_INNER_VOICE_PROMPT;
}

/** 设置心声提示词：返回新角色对象（只改 innerVoicePrompt）。 */
function setInnerVoicePrompt(character = {}, prompt) {
  return { ...character, innerVoicePrompt: String(prompt ?? '') };
}

/**
 * 按模式返回“这一轮要注入的状态指令”（只返回一套）。
 * @returns { mode, instruction }
 * - concise：{ mode:'concise', instruction:'' }——不注入，回复里不带状态/心声。
 * - inner：{ mode:'inner', instruction: 心声提示词 }。
 * - html：{ mode:'html', instruction: 现有状态模板指令 }，即
 *   statusPanel.promptSuffix（模板启用时）；未启用/未写时返回兜底句。
 * 调用方（提示词组装）只需把 instruction 为空时跳过、非空时追加到系统提示词。
 */
function getStatusInstruction(character = {}) {
  const mode = getStatusMode(character);
  if (mode === 'inner') {
    return { mode, instruction: getInnerVoicePrompt(character) };
  }
  if (mode === 'html') {
    const panel = character?.statusPanel || {};
    const suffix = String(panel.promptSuffix || '').trim();
    return { mode, instruction: panel.enabled === false ? '' : (suffix || DEFAULT_HTML_STATUS_PROMPT) };
  }
  return { mode: 'concise', instruction: '' };
}

/** 别名：与 getStatusInstruction 同义，供提示词组装处按“选择器”语义调用。 */
const selectStatusInstruction = getStatusInstruction;

function resolvePromptVersion(character, globalSettings = {}) {

/** 世界书按角色绑定的 worldBookIds 选择，分四个位置，各自按 depth 升序。 */
function collectWorldBooks(character, worldBooks = []) {
const ids = character?.worldBookIds || [];
const byId = new Map(worldBooks.map((w) => [w.id, w]));
const out = { limitBreak: '', before: '', after: '', guidelines: ''};
for (const pos of ['limit_break', 'before', 'after', 'guidelines']) {
const key = pos === 'limit_break'? 'limitBreak': pos;
out[key] = ids
.map((id) => byId.get(id))
.filter((w) => w && w.position === pos)
.sort((a, b) => (a.depth?? 100) - (b.depth?? 100))
.map((w) => w.content)
.join('\n');
}
return out;
}

function collectStickerNames(character, stickers = []) {
const groups = String(character?.stickerGroups || '')
.split(/[,，]/).map((s) => s.trim()).filter((s) => s && s!== '未分类');
if (!groups.length) return [];
return stickers.filter((s) => groups.includes(s.group)).map((s) => s.name);
}

function collectFavoritedJournals(character) {
return (character?.memoryJournals || [])
.filter((j) => j.isFavorited)
.map((j) => `标题：${j.title}\n内容：${j.content}`)
.join('\n\n---\n\n');
}

/** 空白归一化（原文校验的子串匹配用）：多空白折成一个空格、去首尾。 */
function normalizeTextForMatch(s) {
return String(s || '').replace(/\s+/g, ' ').trim();
}

/**
* 有效内容判定（审计结论的执行点，与 memorySummary.countRounds 同一轮定义配套）：
* 物理删除的天然不在（调用方只传现存消息）；另排除 supersededRounds 快照里的
* 消息，以及 isExcludedFromSummary 排除的（状态/思考/不进上下文/撤回/
* <thinking> 开头/隐藏段/空内容）。代码里没有分支概念，这里也不引入分支。
*/
function isValidEvidenceMessage(msg, character, supersededIds) {
if (!msg) return false;
if (supersededIds?.has(msg.id)) return false;
return!isExcludedFromSummary(msg, character);
}

/** 一条消息的全部可比文本：原文 + 协议解包后的正文（[X的消息：正文] 里的正文）。 */
function messageSearchTexts(msg) {
const raw = messageText(msg);
return [raw, extractProtocolText(raw)].map(normalizeTextForMatch).filter(Boolean);
}

/**
* 原文校验：一条要注入的记忆/经历，其引文必须能在当前有效原文中找到。

* 且文本包含该原话；任一句找不到就丢弃整条，不降级成无出处引用。
* 没有原话时退到 sourceMessageIds：每条来源消息都必须仍存在且有效。
* - 记忆（总结）：sourceMessageIds 里的每条来源消息都必须仍存在且有效。
* messagesById 不传时不做引文校验（只由调用方在有消息表时做；app.js 一定传）。

function verifyEvidenceDoc(doc, messagesById, character) {
if (!messagesById) return { ok: true, reason: ''};
const superseded = new Set();

for (const m of r?.messages || []) if (m?.id) superseded.add(m.id);

const checkMessage = (id) => {
const msg = messagesById.get(String(id));
if (!msg) return `来源消息 ${id} 已不存在`;
if (!isValidEvidenceMessage(msg, character, superseded)) return `来源消息 ${id} 已失效（撤回/隐藏/被替换）`;

const quotes = Array.isArray(doc?.quotes)? doc.quotes: [];
if (quotes.length) {
for (const q of quotes) {
const bad = checkMessage(q?.messageId);
if (bad) return { ok: false, reason: `引文对不上原文：${bad}`};
const msg = messagesById.get(String(q.messageId));
const needle = normalizeTextForMatch(q?.text);
if (!needle) return { ok: false, reason: '引文为空，无法校验'};
const haystacks = messageSearchTexts(msg);
if (!haystacks.some((h) => h.includes(needle))) {
return { ok: false, reason: `引文对不上原文：消息 ${q.messageId} 的正文里找不到这句原话`};
}
}
return { ok: true, reason: ''};
}
const ids = Array.isArray(doc?.sourceMessageIds)? doc.sourceMessageIds: [];
if (!ids.length) return { ok: false, reason: '无可校验的引文（没有原话也没有来源消息）'};
for (const id of ids) {
const bad = checkMessage(id);
if (bad) return { ok: false, reason: `引文对不上原文：${bad}`};
}
return { ok: true, reason: ''};
}

/* ---------------- 第 4 波：召回路径与共享 Token 预算 ---------------- */

/**
* 召回路径文案：关键词/向量/融合排名，如“关键词第 2 · 向量第 1 · 融合第 1”；
* 某路未命中就不写那一路；三路都没有时写“直接召回”。
*/
function retrievalPathText(item, fusionRank) {
const parts = [];
if (Number.isFinite(item?.keywordRank)) parts.push(`关键词第 ${item.keywordRank}`);
if (Number.isFinite(item?.vectorRank)) parts.push(`向量第 ${item.vectorRank}`);
if (Number.isFinite(fusionRank)) parts.push(`融合第 ${fusionRank}`);
return parts.length? parts.join(' · '): '直接召回';
}

/**
* 检索证据 + 邻居 + 联想三路共用的记忆 Token 预算（与 vectorMemory
* applyTokenBudget 同一规则：按顺序累计，超预算跳过该条，只有第一条
* 超预算才截断；budget 为 0/falsy 时不截断）。
* units: [{kind:'evidence'|'neighbor'|'assoc', text,...}]（顺序即排名顺序，
* 邻居紧跟所属命中、联想最后）。返回 {kept, skipped:[被跳过的 units]}。
*/
function applySharedMemoryBudget(units, tokenBudget, countTokens = countTextTokens) {
const budget = Number(tokenBudget) || 0;
const list = [...(units || [])];
if (!budget ||!list.length) return { kept: list, skipped: []};
const kept = [];
const skipped = [];
let used = 0;
for (const unit of list) {
const text = String(unit?.text || '');
const tokens = countTokens(text);
if (kept.length && used + tokens > budget) { skipped.push(unit); continue;}
if (!kept.length && tokens > budget) {
// 第一条也超预算：按字符粗截到预算内（中文约 1.2 token/字，与 applyTokenBudget 同规则）。
const keepChars = Math.max(40, Math.floor(budget / 1.2));
kept.push({...unit, text: text.slice(0, keepChars), truncated: true});
used = budget;
continue;
}
kept.push(unit);
used += tokens;
}
return { kept, skipped};
}

/** 时间戳转 “YYYY-MM-DD HH:mm”（本地时间，供邻居/联想展示用）。 */
function formatEvidenceTime(ts) {
if (!Number.isFinite(ts)) return '';
const d = new Date(ts);
if (Number.isNaN(d.getTime())) return '';
const p = (n) => String(n).padStart(2, '0');
return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

/** 经历当前有效的线索：evidenceVersion 必须等于经历现在的 version（与 associative.validClues 同规则）。 */
function validCluesOf(exp) {
const version = exp?.version;
return (exp?.clues || []).filter((c) => c && c.evidenceVersion === version);
}

/**
* 组装记忆三区块（②阶段背景 / ③检索证据+邻居 / ④联想旧事）的结构化结果
* 与注入文本。预览与发送共用同一份结果：buildSystemPrompt 调它，app.js
* 把返回的 memorySections 原样放进 lastBuiltRequest，预览直接渲染它。
*
* 输入：
* - character：当前角色（固定记忆去重 + supersededRounds 校验用）
* - favoritedJournals：收藏记忆（只用于去重判断，文本仍由 collectFavoritedJournals 出）
* - stageSummaries：isSummary 的阶段总结记忆（独立区块，带日期与来源；
* 无出处旧总结只进这里、明确标注“无原文出处”，绝不进证据区）
* - evidenceResults：fusedRetrieve 的 results（原始候选；只接受
* sourceStatus==='sourced' 的文档，无出处的一律丢进 dropped）
* - neighbors：fusedRetrieve 的 neighbors（附在所属命中之后，不占 topN）
* - assoc：lastBuiltRequest.assoc（{pick, mode, use, reason, status}）
* - assocExperience：assoc.pick 对应的经历记录（按 docId 取内容，assoc 里不存正文）
* - messagesById：Map<messageId, message>，原文校验用；不传则跳过引文校验
* - tokenBudget：三路共用的记忆 Token 预算（0/falsy 不截断）
*
* 返回 {stage, evidence, assoc, neighbors, skippedByBudget, dropped,
* combinedText, injectedIntoPrompt}：
* - stage/evidence/assoc 各含 {text（注入文本）, items:[结构化条目]}；
* - evidence.items 每条 {docId, docKind, title, date, source, content,
* retrievalPath, keywordRank, vectorRank, fusionRank, score, sourceStatus,
* chunkId, alsoAssoc, truncated}；neighbors 在所属 evidence item 的
*.neighbors 里（{messageId, speaker, role, timestamp, roundOffset, content}）；
* - assoc: {text, item:{docId, title, date, use, reason, clues, quotes, source,
* alsoInEvidence, truncated} | null, status}，status 为
* 'in-evidence'（pick 已在证据里，不重复注入）/ 'injected' / 'dropped' / 'none'；
* - skippedByBudget: [{kind, docId, title}]（因预算跳过，如实显示）；
* - dropped: [{docId, title, where:'evidence'|'stage'|'assoc'|'neighbor', reason}]。
*/
function assembleMemorySections({
character = null,
favoritedJournals = [],
stageSummaries = [],
evidenceResults = [],
neighbors = [],
assoc = null,
assocExperience = null,
messagesById = null,
tokenBudget = 0,
} = {}) {
const dropped = [];
const favoritedIds = new Set(
(favoritedJournals.length
? favoritedJournals
: (character?.memoryJournals || []).filter((j) => j.isFavorited)
).map((j) => j.id).filter(Boolean),
);

/* —— ③检索证据：只接受 sourced；与固定记忆按 id 去重；原文校验 —— */
const evidenceById = new Map();
(evidenceResults || []).forEach((raw, idx) => {
const docId = raw?.docId || raw?.journalId || raw?.id;
if (!docId) return;
const title = raw?.title || '未命名';
if (evidenceById.has(docId)) return;
if (favoritedIds.has(docId)) return; // 已在收藏记忆里，不重复
if (raw?.sourceStatus!== 'sourced') {
dropped.push({ docId, title, where: 'evidence', reason: '无原文出处，不进检索证据区'});
return;
}
const check = verifyEvidenceDoc(raw, messagesById, character);
if (!check.ok) {
dropped.push({ docId, title, where: 'evidence', reason: check.reason});
return;
}
evidenceById.set(docId, {
docId,
docKind: raw?.docKind || 'journal',
title,
date: raw?.date || '',
source: raw?.source || '',
content: String(raw?.content || raw?.body || ''),
retrievalPath: retrievalPathText(raw, idx + 1),
keywordRank: Number.isFinite(raw?.keywordRank)? raw.keywordRank: null,
vectorRank: Number.isFinite(raw?.vectorRank)? raw.vectorRank: null,
fusionRank: idx + 1,
score: Number.isFinite(raw?.score)? raw.score: null,
sourceStatus: 'sourced',
chunkId: raw?.chunkId?? null,
sourceMessageIds: Array.isArray(raw?.sourceMessageIds)? [...raw.sourceMessageIds]: [],
alsoAssoc: false,
truncated: false,
neighbors: [],
});
});

/* —— 邻居：附在所属命中之后；注入前再按 messageId 确认消息仍存在且有效（防 race） —— */
const neighborByParent = new Map();
for (const n of neighbors || []) {
const parent = evidenceById.get(n?.docId);
if (!parent) continue; // 所属命中没进证据区，邻居也不进
const key = (n?.messageIds || []).join('|') || n?.messageId;
if (!key || neighborByParent.has(`${n.docId}:${key}`)) continue;
neighborByParent.set(`${n.docId}:${key}`, true);
const ids = Array.isArray(n?.messageIds) && n.messageIds.length? n.messageIds: [n?.messageId].filter(Boolean);
if (messagesById) {
const supersededIds = new Set();
for (const r of character?.supersededRounds || []) {
for (const m of r?.messages || []) if (m?.id) supersededIds.add(m.id);
}
const missing = ids.find((id) => {
const msg = messagesById.get(String(id));
return!msg ||!isValidEvidenceMessage(msg, character, supersededIds);
});
if (missing) {
dropped.push({ docId: n.docId, title: parent.title, where: 'neighbor', reason: `相邻对话的消息 ${missing} 已不存在或已失效，整条邻居未注入`});
continue;
}
}
parent.neighbors.push({
messageId: n?.messageId || ids[0] || '',
messageIds: ids,
speaker: n?.speaker || '',
role: n?.role || '',
timestamp: n?.timestamp?? null,
roundOffset: n?.roundOffset?? 0,
content: String(n?.content || ''),
});
}

/* —— ④联想旧事：pick 已在证据里不重复注入，只标注“联想亦选中” —— */
let assocSection = { text: '', item: null, status: 'none'};
const pickId = assoc?.pick || null;
if (pickId) {
if (evidenceById.has(pickId)) {
evidenceById.get(pickId).alsoAssoc = true;
assocSection = {
text: '',
item: {
docId: pickId,
title: evidenceById.get(pickId).title,
date: evidenceById.get(pickId).date,
use: assoc.use || 'understand',
reason: assoc.reason || '',
clues: [],
quotes: [],
source: evidenceById.get(pickId).source,
alsoInEvidence: true,
truncated: false,
},
status: 'in-evidence',
};
} else if (!assocExperience) {
dropped.push({ docId: pickId, title: '', where: 'assoc', reason: '联想选中的经历记录找不到了，未注入'});
assocSection = { text: '', item: null, status: 'dropped'};
} else {
const check = verifyEvidenceDoc(assocExperience, messagesById, character);
if (!check.ok) {
dropped.push({ docId: pickId, title: assocExperience?.title || '', where: 'assoc', reason: check.reason});
assocSection = { text: '', item: null, status: 'dropped'};
} else {
assocSection = {
text: '',
item: {
docId: pickId,
title: assocExperience?.title || '未命名经历',
date: assocExperience?.timestamp? new Date(assocExperience.timestamp).toISOString().slice(0, 10): '',
use: assoc.use || 'understand',
reason: assoc.reason || '',
clues: validCluesOf(assocExperience),
